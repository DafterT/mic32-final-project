name: Ceedling Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ruby ruby-dev gcovr
          sudo gem install ceedling -v 1.0.1 --no-document

      - name: Run unit tests
        run: make test
